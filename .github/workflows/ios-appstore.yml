# iOS 版上架：簽名、打包並上傳到 App Store Connect（上傳後先出現在 TestFlight）
# 只能手動執行（Actions → iOS App Store upload → Run workflow）。
# 需要先在 GitHub repo 的 Settings → Secrets and variables → Actions 設好以下 Secrets（步驟見 ios/AppStore/README.md）：
#   DIST_CERT_P12_BASE64         Apple Distribution 憑證（.p12）的 base64
#   DIST_CERT_PASSWORD           .p12 的密碼
#   PROVISIONING_PROFILE_BASE64  App Store 描述檔（.mobileprovision）的 base64
#   APPSTORE_API_KEY_ID          App Store Connect API 金鑰的 Key ID
#   APPSTORE_API_ISSUER_ID       App Store Connect API 金鑰的 Issuer ID
#   APPSTORE_API_PRIVATE_KEY     API 金鑰檔（AuthKey_XXXX.p8）的完整內容
name: iOS App Store upload

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      VLCKIT_VERSION: "3.7.3"
      VLCKIT_URL: https://download.videolan.org/pub/cocoapods/prod/MobileVLCKit-3.7.3-319ed2c0-79128878.tar.xz
      VLCKIT_SHA256: 0d04059906962ddc9a7bd1ebaa12e1f9ae85eb2466116a97a2f46886dd27a0a9
      BUNDLE_ID: com.lintaixu.wphoto
    steps:
      - name: Check secrets
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          missing=0
          for name in DIST_CERT_P12_BASE64 DIST_CERT_PASSWORD PROVISIONING_PROFILE_BASE64 \
                      APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (see ios/AppStore/README.md)"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - name: Cache MobileVLCKit download
        uses: actions/cache@v5
        with:
          path: ~/vlckit-cache
          key: mobilevlckit-${{ env.VLCKIT_VERSION }}-${{ env.VLCKIT_SHA256 }}

      - name: Fetch MobileVLCKit (official VideoLAN binary, sha256-verified)
        working-directory: ios
        run: |
          TARBALL="$HOME/vlckit-cache/MobileVLCKit-$VLCKIT_VERSION.tar.xz"
          mkdir -p "$HOME/vlckit-cache"
          if [ ! -f "$TARBALL" ]; then
            curl -fL --retry 5 --retry-all-errors -o "$TARBALL" "$VLCKIT_URL"
          fi
          echo "$VLCKIT_SHA256  $TARBALL" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/vlckit" Vendor/MobileVLCKit.xcframework
          mkdir -p "$RUNNER_TEMP/vlckit" Vendor
          tar -xf "$TARBALL" -C "$RUNNER_TEMP/vlckit"
          mv "$RUNNER_TEMP/vlckit/MobileVLCKit-binary/MobileVLCKit.xcframework" Vendor/
          rm -rf "$RUNNER_TEMP/vlckit"

      - name: Install XcodeGen and generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # 暫時的 keychain：只存在這次執行的 runner 裡，結束後刪除
      - name: Install signing certificate and provisioning profile
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          PROFILE="$RUNNER_TEMP/wphoto.mobileprovision"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          if [ "$APP_ID" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::Provisioning profile is for $APP_ID, expected $TEAM_ID.$BUNDLE_ID"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      # 建置號每次自動遞增（App Store Connect 不接受重複的建置號）；版本號在 project.yml 的 MARKETING_VERSION
      - name: Archive
        working-directory: ios
        run: |
          xcodebuild -project wphoto.xcodeproj -scheme wphoto -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/wphoto.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive -quiet

      - name: Export .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/wphoto.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -quiet
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect (TestFlight)
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8"
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/wphoto.ipa" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles"
