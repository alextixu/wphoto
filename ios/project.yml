# XcodeGen 專案定義：在 Mac 上執行 `xcodegen generate` 產生 wphoto.xcodeproj
name: wphoto
options:
  bundleIdPrefix: com.lintaixu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  wphoto:
    type: application
    platform: iOS
    sources:
      - path: wphoto
    dependencies:
      # MobileVLCKit 3.7.3：VideoLAN 官方動態 xcframework（LGPL-2.1），用來播放 AVPlayer 不支援的 MKV/AVI/TS 等格式
      # 不進 git：CI 先下載到 ios/Vendor/（驗證 sha256）再執行 xcodegen generate；本機建置步驟見 README
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
    info:
      path: wphoto/Info.plist
      properties:
        CFBundleDisplayName: wphoto
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hant, zh-Hans]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.lintaixu.wphoto
schemes:
  wphoto:
    build:
      targets:
        wphoto: all
    run:
      config: Debug
